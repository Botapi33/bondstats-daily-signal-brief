<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Brief Archive | BondStats</title><style>body{margin:0;background:#050706;color:#f4f7f4;font-family:Arial,sans-serif}.w{max-width:900px;margin:auto;padding:60px 24px}a{color:inherit}.back{font-size:12px;color:#65f59a;text-decoration:none}.h{font:400 52px Georgia,serif;margin:55px 0 12px}.sub{color:#8f9a93;line-height:1.6;max-width:650px}.list{margin-top:50px;border-top:1px solid #243027}.row{display:grid;grid-template-columns:160px 1fr 90px;padding:22px 0;border-bottom:1px solid #1b241e;text-decoration:none}.state{font:18px Georgia,serif}.count{color:#8f9a93;text-align:right;font-size:12px}@media(max-width:600px){.row{grid-template-columns:110px 1fr}.count{display:none}.h{font-size:42px}}</style></head><body><main class="w"><a class="back" href="index.html">← DAILY SIGNAL BRIEF</a><h1 class="h">Daily Brief Archive</h1><p class="sub">An immutable daily record of BondStats signal states. Each dated file preserves what the structured data showed when that brief was generated.</p><div class="list" id="list"></div></main><script>fetch('data/archive.json?'+Date.now()).then(r=>r.json()).then(d=>{document.getElementById('list').innerHTML=(d.days||[]).map(x=>`<a class="row" href="brief.html?date=${encodeURIComponent(x.date)}"><span>${x.date}</span><span class="state">${x.marketState}</span><span class="count">${x.signals} signals</span></a>`).join('')||'Archive begins with the first successful daily run.'})</script></body></html>
