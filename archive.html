<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050706"><title>Daily Brief Archive | BondStats</title><style>:root{--bg:#050706;--ink:#f4f7f4;--muted:#8e9a92;--line:#1a251e;--green:#64f59a;--serif:Georgia,'Times New Roman',serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.shell{max-width:1100px;margin:auto;padding:0 28px 80px}.mast{height:64px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.mast a{color:var(--green);text-decoration:none}.hero{padding:72px 0 48px;border-bottom:1px solid var(--line)}.hero span{color:var(--green);font-size:10px;letter-spacing:.16em;text-transform:uppercase}.hero h1{font:400 clamp(50px,7vw,84px)/.95 var(--serif);margin:18px 0}.hero p{font:17px/1.6 var(--serif);color:#aeb8b1;max-width:720px}.row{display:grid;grid-template-columns:125px 1fr 100px 80px;gap:24px;padding:25px 0;border-bottom:1px solid var(--line);align-items:start}.date{color:var(--muted);font-size:11px}.row h2{font:400 23px/1.2 var(--serif);margin:0 0 7px}.row p{margin:0;color:var(--muted);font-size:11px}.score{font:400 25px/1 var(--serif);text-align:right}.open{text-align:right}.open a{color:var(--green);text-decoration:none;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.empty{padding:35px 0;color:var(--muted)}footer{padding:32px 0;color:#647068;font-size:10px}@media(max-width:700px){.shell{padding:0 18px 50px}.hero{padding-top:48px}.row{grid-template-columns:1fr 80px}.date{grid-column:1/-1}.open{grid-column:2}.row h2{font-size:21px}}</style></head><body><main class="shell"><header class="mast"><div>BONDSTATS / DAILY MEMORY</div><a href="index.html">Current brief →</a></header><section class="hero"><span>Immutable daily archive</span><h1>What the data showed then.</h1><p>The archive preserves each day’s first successful Daily Signal Brief snapshot. It is designed as market memory, not a silently rewritten news feed.</p></section><section id="list"></section><footer>© 2026 BondStats Ltd. All rights reserved.</footer></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fd=s=>new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(s+'T00:00:00Z'));fetch('data/archive.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{const rows=d.days||[];document.getElementById('list').innerHTML=rows.length?rows.map(x=>`<article class="row"><div class="date">${fd(x.date)}</div><div><h2>${esc(x.marketState||'Unclassified')}</h2><p>${esc(x.oneThing||'Daily archived state')}</p></div><div class="score">${esc(x.intensity??'—')}</div><div class="open"><a href="brief.html?date=${encodeURIComponent(x.date)}">Open →</a></div></article>`).join(''):'<div class="empty">The archive will populate after the first successful daily run.</div>'}).catch(()=>document.getElementById('list').innerHTML='<div class="empty">Archive feed unavailable.</div>');</script></body></html>
