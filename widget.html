<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--bg:#050706;--ink:#f4f7f4;--muted:#8f9a93;--line:#1b251e;--green:#64f59a;--serif:Georgia,'Times New Roman',serif}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;overflow:hidden}.w{min-height:255px;padding:24px 26px;border:1px solid var(--line);position:relative;background:radial-gradient(320px 220px at 89% 28%,rgba(100,245,154,.055),transparent 70%)}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;letter-spacing:.13em;text-transform:uppercase}.top b{color:var(--green)}h1{font:400 clamp(28px,5vw,42px)/1.04 var(--serif);margin:29px 0 11px;max-width:620px}.state{display:flex;gap:16px;align-items:center;color:var(--muted);font-size:11px}.dot{width:8px;height:8px;border:1px solid var(--green);border-radius:50%;box-shadow:0 0 18px rgba(100,245,154,.4)}a{position:absolute;right:26px;bottom:23px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--green);font-size:11px}@media(max-width:520px){.w{padding:20px;min-height:230px}a{left:20px;right:auto;bottom:20px}h1{margin-top:24px;font-size:31px}}</style></head><body><div class="w"><div class="top"><b>Daily Signal Brief</b><span id="date">Loading</span></div><h1 id="one">Follow what changed underneath the headlines.</h1><div class="state"><i class="dot"></i><span id="state">Loading market state…</span></div><a href="index.html" target="_blank" rel="noopener">Open today’s brief →</a></div><script>fetch('data/latest.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('one').textContent=d.oneThing?.headline||'Follow what changed underneath the headlines.';document.getElementById('state').textContent=(d.marketState?.label||'Unclassified')+' · '+(d.marketState?.intensity??'—')+'/100';document.getElementById('date').textContent=new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',timeZone:'UTC'}).format(new Date(d.meta.generatedAt))}).catch(()=>document.getElementById('state').textContent='Feed unavailable');</script></body></html>
