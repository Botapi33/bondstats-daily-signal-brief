<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Signal Brief Health</title><style>body{background:#050706;color:#eee;font:14px Arial;margin:0}.w{max-width:760px;margin:auto;padding:50px 22px}h1{font:38px Georgia}.r{display:flex;justify-content:space-between;padding:16px 0;border-top:1px solid #1b241e}.ok{color:#65f59a}.bad{color:#d6a96b}p{color:#8f9a93;line-height:1.6}</style></head><body><main class="w"><h1>Daily Signal Brief / Source Health</h1><p>The brief fails closed: required source failure retains the last-known-good brief. Daily yield-change claims require fresh daily, non-fallback observations.</p><div id="rows"></div></main><script>fetch('data/latest.json?'+Date.now()).then(r=>r.json()).then(d=>{rows.innerHTML=Object.entries(d.meta.sourceHealth).map(([k,v])=>`<div class="r"><b>${k.toUpperCase()}</b><span class="${v==='ok'?'ok':'bad'}">${v.toUpperCase()}</span></div>`).join('')})</script></body></html>
