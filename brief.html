<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050706"><title>Archived Daily Signal Brief | BondStats</title><style>:root{--bg:#050706;--ink:#f4f7f4;--muted:#8e9a92;--line:#1a251e;--green:#64f59a;--serif:Georgia,'Times New Roman',serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.shell{max-width:1040px;margin:auto;padding:0 28px 80px}.mast{height:64px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.mast a{color:var(--green);text-decoration:none}.hero{padding:65px 0 48px;border-bottom:1px solid var(--line)}.hero .date{color:var(--green);font-size:10px;letter-spacing:.15em;text-transform:uppercase}.hero h1{font:400 clamp(46px,6vw,72px)/.96 var(--serif);margin:18px 0}.state{font:400 25px/1.2 var(--serif);color:#cfd7d1}.one,.section{padding:38px 0;border-bottom:1px solid var(--line)}.label{color:var(--green);font-size:9px;letter-spacing:.14em;text-transform:uppercase}.one h2,.section h2{font:400 30px/1.15 var(--serif);margin:12px 0}.one p,.signal p,.dis p{color:var(--muted);line-height:1.6}.signal,.dis{padding:21px 0;border-top:1px solid var(--line)}.signal h3,.dis h3{font:400 21px/1.25 var(--serif);margin:5px 0}.meta{color:var(--muted);font-size:10px}.empty{color:var(--muted);padding:20px 0}footer{padding:32px 0;color:#647068;font-size:10px}@media(max-width:650px){.shell{padding:0 18px 50px}.hero{padding-top:45px}}</style></head><body><main class="shell"><header class="mast"><div>BONDSTATS / ARCHIVED SIGNAL</div><a href="archive.html">Archive →</a></header><section class="hero"><div class="date" id="date">Loading</div><h1 id="headline">Daily Signal Brief</h1><div class="state" id="state"></div></section><section class="one"><div class="label">THE ONE THING</div><h2 id="one"></h2><p id="oneBody"></p></section><section class="section"><div class="label">SIGNALS</div><h2>Signals Before the Headlines</h2><div id="signals"></div></section><section class="section"><div class="label">DISLOCATIONS</div><h2>Where the market stopped rhyming</h2><div id="dis"></div></section><footer>Archived snapshot · © 2026 BondStats Ltd. All rights reserved.</footer></main><script>const q=new URLSearchParams(location.search),date=q.get('date');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')){location.href='archive.html'}else fetch('data/archive/'+date+'.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{document.getElementById('date').textContent=date;document.getElementById('state').textContent=(d.marketState?.label||'Unclassified')+' · '+(d.marketState?.intensity??'—')+'/100';document.getElementById('one').textContent=d.oneThing?.headline||'No qualifying headline';document.getElementById('oneBody').textContent=d.oneThing?.body||'';const s=d.signals||[];document.getElementById('signals').innerHTML=s.length?s.map(x=>`<article class="signal"><div class="meta">${esc(x.kicker)} · SIGNAL ${esc(x.strength)}</div><h3>${esc(x.headline)}</h3><p>${esc(x.body)}</p></article>`).join(''):'<div class="empty">No qualifying signal was archived.</div>';const a=d.dislocations||[];document.getElementById('dis').innerHTML=a.length?a.map(x=>`<article class="dis"><div class="meta">${esc(x.pair)}</div><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p></article>`).join(''):'<div class="empty">No rule-qualified dislocation was archived.</div>'}).catch(()=>document.getElementById('headline').textContent='Archive entry unavailable');</script></body></html>
