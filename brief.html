<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archived Daily Brief | BondStats</title><style>body{margin:0;background:#050706;color:#f4f7f4;font-family:Arial,sans-serif}.w{max-width:900px;margin:auto;padding:55px 24px}a{color:#65f59a}.date{font:400 54px Georgia,serif;margin:45px 0 8px}.state{color:#9aa59e}.sig{padding:24px 0;border-top:1px solid #1b241e}.sig small{color:#65f59a;letter-spacing:.12em}.sig h2{font:400 24px Georgia,serif}.sig p{color:#9aa59e;line-height:1.6}</style></head><body><main class="w"><a href="archive.html">← Archive</a><h1 class="date" id="date"></h1><div class="state" id="state"></div><div id="signals" style="margin-top:45px"></div></main><script>const q=new URLSearchParams(location.search).get('date');if(!/^\d{4}-\d{2}-\d{2}$/.test(q||''))location.href='archive.html';fetch('data/archive/'+q+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{date.textContent=d.meta.date;state.textContent=d.marketState.label;signals.innerHTML=(d.signals||[]).map(x=>`<article class="sig"><small>${x.kicker}</small><h2>${x.headline}</h2><p>${x.body}</p></article>`).join('')||'No qualifying signals were recorded.'}).catch(()=>signals.textContent='Archived brief not found.')</script></body></html>
